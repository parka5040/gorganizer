name: Prebuilt Linux release
on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: prebuilt-linux-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read version
        id: version
        run: printf 'version=%s\n' "$(< VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check version is unreleased
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG is already released. Bump VERSION to publish a new release."
            exit 1
          fi
      - name: Build twice and smoke-test
        run: |
          mkdir -p dist
          docker build -f packaging/Containerfile -t gorganizer-release .
          docker run --rm --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$PWD/dist,dst=/dist" \
            -e RELEASE_COMMIT="$(git rev-parse HEAD)" \
            -e RELEASE_COMMIT_TIME="$(git show -s --format=%cI HEAD)" \
            gorganizer-release bash /src/packaging/reproduce.sh /src /dist
          docker run --rm --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$PWD/dist,dst=/dist,readonly" \
            gorganizer-release bash /src/packaging/smoke-release.sh "/dist/gorganizer-$(< VERSION)-linux-x86_64.tar.gz"
          cp packaging/install.sh dist/install.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prebuilt-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The release environment only allows deployments from main.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prebuilt-linux-x86_64
          path: dist
      - name: Validate release artifacts
        env:
          TAG: v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]
          shopt -s dotglob nullglob
          entries=(dist/*)
          [ "${#entries[@]}" -eq 3 ]
          for name in "gorganizer-$VERSION-linux-x86_64.tar.gz" SHA256SUMS install.sh; do
            [ -f "dist/$name" ] && [ ! -L "dist/$name" ]
          done
          for entry in "${entries[@]}"; do
            case "$(basename "$entry")" in
              "gorganizer-$VERSION-linux-x86_64.tar.gz"|SHA256SUMS|install.sh) ;;
              *) exit 1 ;;
            esac
          done
          cd dist
          sha256sum -c SHA256SUMS
      - name: Sign release checksums
        env:
          TAG: v${{ needs.build.outputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_SIGNING_KEY:-}" ] || { echo "RELEASE_SIGNING_KEY is not configured." >&2; exit 1; }
          umask 077
          signing_dir="$RUNNER_TEMP/signing"
          mkdir -p "$signing_dir"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$signing_dir/signing-key.pem"
          bash packaging/sign-release.sh --tag "$TAG" --sums dist/SHA256SUMS --out dist/SHA256SUMS.sig "$signing_dir/signing-key.pem"
      - name: Verify release signature
        env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/verify-release-sig.sh --tag "$TAG" --sums dist/SHA256SUMS --sig dist/SHA256SUMS.sig --trust internal/release/release-signing.pub.pem --require-all
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf 'Prebuilt Linux x86_64 bundle for SteamOS, Bazzite, Debian, Ubuntu, Fedora and Arch.\n\nReleases are signed; the in-app updater and gorganizer.sh update verify the signature.\n\nInstall:\n\n    curl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh\n' \
            "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Gorganizer $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "dist/gorganizer-$VERSION-linux-x86_64.tar.gz" dist/SHA256SUMS dist/SHA256SUMS.sig dist/install.sh
